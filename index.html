<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>Verse</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div id="app">
    <!-- ヘッダー -->
    <header class="app-header">
      <button id="btnBack" class="icon-btn only-mobile" hidden aria-label="一覧へ戻る">‹</button>
      <h1 class="app-title">Verse</h1>
      <div class="header-actions">
        <button id="btnStorage" class="icon-btn" title="ストレージ使用量" aria-label="ストレージ使用量">▦</button>
        <button id="btnData" class="icon-btn" title="データ管理" aria-label="データ管理">⋯</button>
      </div>
    </header>

    <!-- 本体（2ペイン） -->
    <main class="app-main">
      <!-- 左: 一覧ペイン -->
      <section class="pane pane-list" id="paneList">
        <div class="list-toolbar">
          <input type="search" id="searchInput" class="search-input" placeholder="曲名・歌詞・タグ・ステータスで検索" />
          <button id="btnNew" class="btn btn-primary">＋ 新規</button>
        </div>
        <div class="list-filter" id="statusFilter">
          <!-- ステータスフィルタchipsはJSで生成 -->
        </div>
        <ul class="song-list" id="songList" aria-label="曲一覧"></ul>
        <p class="empty-hint" id="listEmpty" hidden>曲がありません。「＋ 新規」から追加してください。</p>
      </section>

      <!-- 右: 詳細ペイン -->
      <section class="pane pane-detail" id="paneDetail">
        <div class="detail-empty" id="detailEmpty">
          <p>左の一覧から曲を選択するか、「＋ 新規」で追加してください。</p>
        </div>
        <div class="detail-body" id="detailBody" hidden></div>
      </section>
    </main>
  </div>

  <!-- モーダル: 汎用 -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" id="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle"></h2>
        <button class="icon-btn" id="modalClose" aria-label="閉じる">✕</button>
      </div>
      <div class="modal-content" id="modalContent"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <!-- トースト通知 -->
  <div class="toast" id="toast" hidden></div>

  <script src="./js/zip.js"></script>
  <script src="./js/db.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/media.js"></script>
  <script src="./js/versions.js"></script>
  <script src="./js/backup.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
